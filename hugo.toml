baseURL = "https://mahroot.dev/"
publishDir = "public"
title        = "mahroot's blog"
languageCode = "en-us"
theme        = "hello-friend-ng"
pagerSize = 10


[params]
  author = "Ayoub"
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Subtitle for home
  homeSubtitle = "Thoughts, notes, projects wa AchyaO Okhra ..."
  disableReadOtherPosts = false
  enableSharingButtons = true
  enableGlobalLanguageMenu = false
  description = "I write about software engineering, and about life, in English and Darija."
  keywords = "homepage, blog"
  # Share card (X, Discord, LinkedIn…) for any page that has no image of its own. 1200x630.
  images = ["/img/og.png"]
  # X handle, without the @ (twitter:site / twitter:creator in layouts/partials/head.html)
  xHandle = "mahr00t"
  customCSS = ["/css/custom.css"]

[params.favicon]
  mask = "/favicon.png"
  msapplication = "/favicon.png"
  shortcut = "/favicon.png"


[taxonomies]
    category = "categories"
    tag      = "tags"
    series   = "series"

[languages]
  [languages.en]
    title = "mahroot's blog"
    keywords = "tech, personal, blog"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    readOtherPosts = "Read other posts"

  [languages.en.params]
    subtitle  = "Thoughts, notes,projects wa AchyaO Okhra ..."

    [languages.en.params.logo]
      logoText = "mahroot"
      logoHomeLink = "/"
    # or
    #
    # path = "/img/your-example-logo.svg"
    # alt = "Your example logo alt text"


# Blog menu item
[[menu.main]]
  identifier = "blog"
  name       = "Blog"
  url        = "/posts"
  weight     = 1

# Notes menu item (the section folder and URLs stay "ilt", so links and the vault's ILT/ folder keep working)
[[menu.main]]
  identifier = "ilt"
  name       = "Notes"
  url        = "/ilt/"
  weight     = 5

# About menu item (content/about.md lives outside sync.py's folders: edit it in the repo)
[[menu.main]]
  identifier = "about"
  name       = "About"
  url        = "/about/"
  weight     = 10

# Headings of the list pages. Set here, not in content/<section>/_index.md, because sync.py
# would pull an _index.md into the vault's BLOG/ or ILT/ folder.
[[cascade]]
  title = "Blog"
  [cascade.target]
    path = "/posts"
    kind = "section"

[[cascade]]
  title = "Notes"
  [cascade.target]
    path = "/ilt"
    kind = "section"


[permalinks]
  ilt = "/ilt/:year/:month/:day/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true 

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

# Comments: https://giscus.app, stored in this repo's GitHub Discussions. Category
# Announcements, so only giscus and the repo owner open threads. Readers sign in with GitHub.
# Needs the giscus GitHub App installed on this repo. Empty repoId = comments hidden.
[params.giscus]
  repo       = "ayoubMah/ayoubMah.github.io"
  repoId     = "R_kgDOPbrvzA"
  category   = "Announcements"
  categoryId = "DIC_kwDOPbrvzM4DMGpz"
